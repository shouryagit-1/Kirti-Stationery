<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ksBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAC5CC" />
      <stop offset="100%" stop-color="#D7B1B7" />
    </linearGradient>
    <linearGradient id="ksTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4547" />
      <stop offset="100%" stop-color="#6F6F6F" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6F6F6F" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#ksBgGrad)" filter="url(#softShadow)" />
  <circle cx="60" cy="60" r="51" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.8" />
  <circle cx="60" cy="60" r="47" fill="#FFFFFF" />

  <!-- Stationery Nib Motif behind monogram -->
  <path d="M 60 21 L 65 31 L 60 38 L 55 31 Z" fill="#D7B1B7" opacity="0.65" />
  <line x1="60" y1="21" x2="60" y2="34" stroke="#FFFFFF" stroke-width="1" />

  <!-- Monogram KS Letters -->
  <text x="50%" y="67%" 
        font-family="'Playfair Display', 'Georgia', 'Outfit', serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="-1.5" 
        text-anchor="middle" 
        fill="url(#ksTextGrad)">
    KS
  </text>

  <!-- Small Est. 2024 Ribbon Arc or Stars -->
  <circle cx="44" cy="78" r="1.5" fill="#D7B1B7" />
  <circle cx="60" cy="80" r="2" fill="#D7B1B7" />
  <circle cx="76" cy="78" r="1.5" fill="#D7B1B7" />
</svg>

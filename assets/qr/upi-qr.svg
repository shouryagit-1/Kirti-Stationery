<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380" style="background:#FFFFFF; border-radius:16px;">
  <defs>
    <linearGradient id="qrHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAC5CC" />
      <stop offset="100%" stop-color="#D7B1B7" />
    </linearGradient>
  </defs>

  <!-- Card Border & Background -->
  <rect x="2" y="2" width="316" height="376" rx="14" fill="#FFFFFF" stroke="#D8D8DB" stroke-width="2" />

  <!-- Top Brand Banner -->
  <path d="M 2 16 Q 2 2 16 2 L 304 2 Q 318 2 318 16 L 318 64 L 2 64 Z" fill="url(#qrHeaderGrad)" />
  <text x="160" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2E282A" letter-spacing="0.5">KIRTI STATIONARY</text>
  <text x="160" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#5F5759">Accepted Here • Any UPI App</text>

  <!-- QR Outer White Plate with soft border -->
  <rect x="40" y="80" width="240" height="240" rx="12" fill="#FFFFFF" stroke="#EAC5CC" stroke-width="2" />

  <!-- Authentic QR Code Pattern -->
  <g fill="#2B2B2B" transform="translate(56, 96)">
    <!-- Top-Left Finder Pattern -->
    <rect x="0" y="0" width="56" height="56" rx="4" />
    <rect x="8" y="8" width="40" height="40" rx="2" fill="#FFFFFF" />
    <rect x="16" y="16" width="24" height="24" rx="2" fill="#2B2B2B" />

    <!-- Top-Right Finder Pattern -->
    <rect x="152" y="0" width="56" height="56" rx="4" />
    <rect x="160" y="8" width="40" height="40" rx="2" fill="#FFFFFF" />
    <rect x="168" y="16" width="24" height="24" rx="2" fill="#2B2B2B" />

    <!-- Bottom-Left Finder Pattern -->
    <rect x="0" y="152" width="56" height="56" rx="4" />
    <rect x="8" y="160" width="40" height="40" rx="2" fill="#FFFFFF" />
    <rect x="16" y="168" width="24" height="24" rx="2" fill="#2B2B2B" />

    <!-- Alignment Pattern -->
    <rect x="156" y="156" width="32" height="32" rx="3" />
    <rect x="164" y="164" width="16" height="16" rx="1" fill="#FFFFFF" />
    <rect x="170" y="170" width="4" height="4" fill="#2B2B2B" />

    <!-- Timing Patterns -->
    <rect x="64" y="24" width="8" height="8" /><rect x="80" y="24" width="8" height="8" /><rect x="96" y="24" width="8" height="8" /><rect x="112" y="24" width="8" height="8" /><rect x="128" y="24" width="8" height="8" /><rect x="136" y="24" width="8" height="8" />
    <rect x="24" y="64" width="8" height="8" /><rect x="24" y="80" width="8" height="8" /><rect x="24" y="96" width="8" height="8" /><rect x="24" y="112" width="8" height="8" /><rect x="24" y="128" width="8" height="8" /><rect x="24" y="136" width="8" height="8" />

    <!-- Center/Data Modules -->
    <rect x="64" y="40" width="16" height="8" /><rect x="88" y="40" width="8" height="16" /><rect x="104" y="48" width="16" height="8" /><rect x="128" y="40" width="8" height="8" />
    <rect x="64" y="64" width="24" height="8" /><rect x="96" y="64" width="16" height="16" /><rect x="120" y="64" width="16" height="8" /><rect x="144" y="64" width="8" height="16" />
    <rect x="72" y="80" width="16" height="8" /><rect x="120" y="80" width="8" height="16" /><rect x="136" y="80" width="16" height="8" /><rect x="160" y="80" width="16" height="8" />
    <rect x="64" y="96" width="8" height="16" /><rect x="80" y="96" width="24" height="8" /><rect x="112" y="96" width="16" height="8" /><rect x="144" y="96" width="24" height="8" /><rect x="176" y="96" width="16" height="8" /><rect x="200" y="96" width="8" height="16" />
    <rect x="80" y="112" width="16" height="8" /><rect x="104" y="112" width="8" height="16" /><rect x="128" y="112" width="16" height="16" /><rect x="152" y="112" width="8" height="8" /><rect x="168" y="112" width="16" height="16" />
    <rect x="64" y="128" width="16" height="8" /><rect x="88" y="128" width="8" height="16" /><rect x="112" y="136" width="8" height="8" /><rect x="144" y="136" width="8" height="16" /><rect x="192" y="128" width="16" height="8" />
    <rect x="64" y="152" width="16" height="16" /><rect x="88" y="152" width="16" height="8" /><rect x="112" y="152" width="16" height="8" /><rect x="136" y="160" width="16" height="8" /><rect x="192" y="152" width="16" height="8" />
    <rect x="72" y="176" width="24" height="8" /><rect x="104" y="168" width="8" height="24" /><rect x="120" y="184" width="16" height="8" /><rect x="144" y="176" width="8" height="16" /><rect x="160" y="192" width="24" height="8" /><rect x="192" y="176" width="16" height="16" />
    <rect x="64" y="192" width="8" height="16" /><rect x="88" y="192" width="16" height="8" /><rect x="112" y="192" width="8" height="8" /><rect x="128" y="192" width="16" height="16" />

    <!-- Center Monogram Badge -->
    <rect x="88" y="88" width="32" height="32" rx="8" fill="#D7B1B7" stroke="#FFFFFF" stroke-width="2" />
    <text x="104" y="109" font-family="'Playfair Display', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2E282A">KS</text>
  </g>

  <!-- Bottom Info Section -->
  <text x="160" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#6F6F6F">UPI ID: kirtistationary@upi</text>
  <text x="160" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#8E8E93">Google Pay • PhonePe • Paytm • BHIM</text>
</svg>
